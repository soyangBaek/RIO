# ─────────────────────────────────────────────────────────────
# RIO 음성 인식 런타임 설정
#
# 본체 (src/app/main.py) 에서 LiveVoiceBackend 가 읽어 사용.
# 샌드박스는 configs/voice_sandbox.yaml 에서 이 파일을 extends 하여 사용한다.
# 튜닝 시에는 샌드박스에서 먼저 실험한 뒤 확정값을 이 파일에 반영한다.
# ─────────────────────────────────────────────────────────────

# ── 백엔드 실행 정책 ─────────────────────────────────────────
backend:
  # Phase 1: Rust worker 를 우선 사용하고, 준비되지 않았으면 Python backend 로 fallback.
  type: "rust"
  worker_path: "native/bin/rio-audio-worker"
  fallback_to_python: true
  startup_timeout_ms: 3000


# ── 오디오 캡처 (sounddevice + PipeWire) ────────────────────
audio:
  # PipeWire/PulseAudio 경유로 열기 위해 "pulse" 고정.
  # raw ALSA (hw:X,Y) 는 장치/환경마다 입력 포맷 차이가 커서 추천하지 않음.
  device: "pulse"

  sample_rate: 16000
  channels: 1
  blocksize: 512         # 약 32ms. Pi 에서 지연/안정성 균형이 좋은 기본값.
  dtype: "float32"

  # 프로그램 시작 시 pactl 로 mic 게인 자동 설정. null 이면 건드리지 않음.
  # close-talk (입 바로 앞): 20~30 권장.
  mic_gain_percent: 25

  # PipeWire/PulseAudio source 이름 부분 일치.
  # `device: "pulse"` 일 때는 실행 직전에 이 source 를 default input 으로 맞추고,
  # mic gain 도 같은 source 에 적용한다.
  # null 이면 현재 default source 를 그대로 사용한다.
  gain_target_source: "AB13X"


# ── VAD: RMS 기반 세그먼터 ──────────────────────────────────
vad:
  # 16-bit PCM 기준 RMS 임계값. AB13X close-talk 실측:
  # 조용한 방 일반 소음 max≈100~290, 간헐 스파이크 400~700 관측됨.
  # 350 에서는 소음 스파이크가 speech 로 오트리거되어 Listening↔Idle 플래핑 발생.
  # 700 으로 올려 스파이크를 거의 차단하면서 발화 RMS(수천) 여유 유지.
  threshold: 700
  # 300ms 는 숨쉬는 간격에 조각나기 쉬워 500ms 로 여유.
  min_silence_duration_ms: 500
  speech_pad_ms: 30
  # 150ms 이하 짧은 스파이크는 발화 아님으로 확실히 drop.
  min_speech_ms: 300


# ── ASR: faster-whisper 1.2.x ────────────────────────────────
asr:
  model: "base"          # tiny/base/small
  language: "ko"
  beam_size: 1
  compute_type: "int8"
  device: "cpu"
  no_speech_threshold: 0.6
  condition_on_previous_text: true

  # logprob 하한. 이보다 낮으면 capture 에 주입 안 함 (환각 차단).
  # 샌드박스의 wake_word.min_asr_logprob 와 동일 역할.
  min_logprob: -1.0

  # Whisper 디코더 바이어싱. 공식 발화(docs/user-utterance-scenarios.md)
  # 어휘를 직전 문맥으로 주입해 디코딩을 해당 방향으로 기울인다.
  # 각 intent 당 하나씩만 허용하는 정책이므로 이 프롬프트에도 공식 발화의
  # 키워드만 담는다. 유사/변형 표현은 넣지 않는다.
  initial_prompt: "에어컨 켜줘 에어컨 꺼줘 난방 켜줘 난방 꺼줘 불 켜줘 불 꺼줘 간접등 켜줘 간접등 꺼줘 티비 켜줘 티비 꺼줘 컴퓨터 켜줘 컴퓨터 꺼줘 청소기 돌려줘 청소기 정지 공기청정기 켜줘 공기청정기 꺼줘 음악 틀어줘 음악 꺼줘 다 꺼줘 사진 찍어줘 날씨 알려줘 춤춰줘 게임 모드 분 뒤에 알려줘 초 뒤에 알려줘 취소 확인"


# ── 동시성 ───────────────────────────────────────────────────
concurrency:
  # depth=1 규칙. ASR 디코딩 중 새 utterance 가 도착하면 drop.
  # true 권장 (Pi CPU 보호 + 응답 일관성).
  drop_while_busy: true


# ── 로깅 ─────────────────────────────────────────────────────
logging:
  # INFO: 발화/디코딩 요약만. DEBUG: VAD 프레임 RMS(500ms 윈도우) 주기 로그.
  # CLI `--log info` 를 주면 런타임에 DEBUG + python backend 로 덮어쓴다 (튜닝용).
  level: "INFO"
