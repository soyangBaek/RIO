home_client:
  base_url: "http://127.0.0.1:8123"
  control_path: "/device/control"
  # If your ThinkQ bridge exposes a full endpoint URL, set it here and it
  # will override base_url + control_path.
  # control_url: "http://192.168.0.20:8123/api/thinq/control"
weather:
  base_url: "https://api.open-meteo.com/v1/forecast"
  default_location: "seoul"
  display_seconds: 6.0
  locations:
    seoul:
      latitude: 37.5665
      longitude: 126.9780
    busan:
      latitude: 35.1796
      longitude: 129.0756
    incheon:
      latitude: 37.4563
      longitude: 126.7052
devices:
  tv:
    id: "tv.living_room"
    name: "TV"
    template: "{device_id}:{action}"
  computer:
    id: "computer.desk"
    name: "Computer"
    template: "{device_id}:{action}"
  light:
    id: "light.main"
    name: "Living room light"
    template: "{device_id}:{action}"
  indirect_light:
    id: "light.indirect"
    name: "Indirect light"
    template: "{device_id}:{action}"
  robot_cleaner:
    id: "cleaner.bot"
    name: "Robot cleaner"
    template: "{device_id}:{action}"
  air_purifier:
    id: "purifier.living_room"
    name: "Air purifier"
    template: "{device_id}:{action}"
  aircon:
    id: "aircon.living_room"
    name: "Air conditioner"
    template: "{device_id}:{action}"
  heater:
    id: "heater.living_room"
    name: "Heater"
    template: "{device_id}:{action}"
  music:
    id: "speaker.main"
    name: "Music"
    template: "{device_id}:{action}"
