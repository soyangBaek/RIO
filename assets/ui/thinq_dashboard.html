<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThinQ – 거실 대시보드</title>
<style>
  :root {
    --bg: #0d1117;
    --wall: #1c2333;
    --floor: #151b28;
    --floor-line: rgba(255,255,255,0.03);
    --on-glow: #ff4466;
    --on-glow-soft: rgba(255,68,102,0.15);
    --on-glow-strong: rgba(255,68,102,0.6);
    --light-glow: #ffdd57;
    --text: #e8eaf0;
    --text-dim: #5c6580;
    --accent: #2ea6ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ──────────────────── */
  header {
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    z-index: 10;
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: 2px; }
  .logo span { color: var(--accent); }
  .sub { color: var(--text-dim); font-size: 12px; margin-left: 4px; }
  .conn { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .conn-dot.off { background: var(--on-glow); box-shadow: 0 0 6px var(--on-glow); }

  /* ── Room Container ──────────── */
  .room-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .room {
    position: relative;
    width: 960px;
    height: 600px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--floor);
    box-shadow: 0 22px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .room::before {
    content:'';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 18%, rgba(255,255,255,0.07), transparent 42%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Walls & Floor ───────────── */
  .wall-back {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 52%;
    background: linear-gradient(180deg, #1a2236 0%, #1c2538 100%);
    border-bottom: 3px solid rgba(255,255,255,0.04);
  }
  .wall-panel {
    position: absolute;
    top: 72px;
    height: 190px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
    z-index: 1;
  }
  .wall-panel.left {
    left: 22px;
    width: 270px;
  }
  .wall-panel.right {
    right: 20px;
    width: 400px;
  }
  .baseboard {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(52% - 10px);
    height: 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.1));
    z-index: 1;
  }
  .wall-back::after {
    content:'';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(180deg, rgba(0,0,0,0.3), transparent);
  }
  .floor-area {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 48%;
    background:
      repeating-linear-gradient(90deg, var(--floor-line) 0, var(--floor-line) 1px, transparent 1px, transparent 80px),
      linear-gradient(180deg, #151b28, #111724);
  }

  /* ── Window ──────────────────── */
  .window {
    position: absolute;
    top: 24px; right: 44px;
    width: 110px; height: 120px;
    border: 3px solid #2a3450;
    border-radius: 4px;
    background: linear-gradient(160deg, #1e2d4a, #162040);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    z-index: 1;
  }
  .window-glow {
    position: absolute;
    inset: 10px;
    border-radius: 2px;
    background: linear-gradient(180deg, rgba(135,190,255,0.22), rgba(135,190,255,0.06));
    pointer-events: none;
  }
  .window::before {
    content:''; position:absolute;
    top: 50%; left: 0; right: 0; height: 3px;
    background: #2a3450; transform: translateY(-50%);
  }
  .window::after {
    content:''; position:absolute;
    left: 50%; top: 0; bottom: 0; width: 3px;
    background: #2a3450; transform: translateX(-50%);
  }

  /* ── Sofa ─────────────────────── */
  .sofa {
    position: absolute;
    bottom: 56px; left: 50%;
    transform: translateX(-50%);
    width: 260px; height: 72px;
    background: #2d3553;
    border-radius: 12px 12px 8px 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    z-index: 1;
  }
  .sofa::before {
    content:''; position:absolute;
    top: -18px; left: 10px; right: 10px;
    height: 22px;
    background: #343d5c;
    border-radius: 6px 6px 0 0;
  }
  .sofa::after {
    content:'';
    position: absolute;
    left: 20px; right: 20px;
    top: 10px; height: 3px;
    background: rgba(255,255,255,0.04);
    border-radius: 2px;
  }

  /* ── Coffee Table ────────────── */
  .coffee-table {
    position: absolute;
    bottom: 142px; left: 50%;
    transform: translateX(-50%);
    width: 140px; height: 44px;
    background: #252e45;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    z-index: 1;
  }
  .media-console {
    position: absolute;
    top: 192px;
    left: 50%;
    transform: translateX(-34%);
    width: 290px;
    height: 64px;
    background: linear-gradient(180deg, #2b3248, #232b3f);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 10px 24px rgba(0,0,0,0.22);
    z-index: 1;
  }
  .media-console::before {
    content:'';
    position: absolute;
    left: 18px;
    right: 18px;
    top: 13px;
    height: 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
  }
  .media-console::after {
    content:'';
    position: absolute;
    left: 50%;
    bottom: 12px;
    width: 120px;
    height: 20px;
    transform: translateX(-50%);
    border-radius: 8px;
    background: linear-gradient(180deg, rgba(0,0,0,0.22), rgba(255,255,255,0.03));
  }
  .plant {
    position: absolute;
    right: 216px;
    top: 214px;
    width: 44px;
    height: 70px;
    z-index: 1;
  }
  .plant-pot {
    position: absolute;
    bottom: 0;
    left: 9px;
    width: 26px;
    height: 24px;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(180deg, #c2774a, #8f5431);
  }
  .plant-leaf {
    position: absolute;
    bottom: 20px;
    width: 14px;
    height: 32px;
    border-radius: 14px 14px 2px 14px;
    background: linear-gradient(180deg, #4dc17b, #2f7d52);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,0.12);
    transform-origin: bottom center;
  }
  .plant-leaf.l1 { left: 2px; transform: rotate(-28deg); }
  .plant-leaf.l2 { left: 14px; height: 38px; transform: rotate(-4deg); }
  .plant-leaf.l3 { left: 26px; transform: rotate(22deg); }

  /* ── Desk (right side, for computer + speaker) ── */
  .desk {
    position: absolute;
    top: 220px; right: 30px;
    width: 160px; height: 50px;
    background: #2c3348;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    z-index: 1;
  }
  .desk::before {
    content:'';
    position: absolute;
    top: 8px;
    left: 14px;
    right: 14px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.05);
  }
  .desk-leg-l, .desk-leg-r {
    position: absolute;
    bottom: -30px;
    width: 6px; height: 30px;
    background: #252e40;
    border-radius: 0 0 2px 2px;
  }
  .desk-leg-l { left: 12px; }
  .desk-leg-r { right: 12px; }

  /* ── Side Table (left, for indirect lamp) ──────── */
  .side-table {
    position: absolute;
    top: 240px; left: 36px;
    width: 56px; height: 26px;
    background: #2c3348;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    z-index: 1;
  }
  .side-table-leg-l, .side-table-leg-r {
    position: absolute;
    bottom: -22px;
    width: 4px; height: 22px;
    background: #252e40;
    border-radius: 0 0 2px 2px;
  }
  .side-table-leg-l { left: 8px; }
  .side-table-leg-r { right: 8px; }

  /* ── Rug ──────────────────────── */
  .rug {
    position: absolute;
    bottom: 36px; left: 50%;
    transform: translateX(-50%);
    width: 340px; height: 170px;
    background: radial-gradient(ellipse, rgba(46,166,255,0.05), transparent 70%);
    border-radius: 50%;
    z-index: 0;
  }

  /* ── Device Hotspot (clickable) ─ */
  .device-spot {
    position: absolute;
    cursor: pointer;
    transition: transform 0.2s;
    z-index: 5;
  }
  .device-spot:hover { transform: scale(1.08); }
  .device-spot:active { transform: scale(0.95); }

  /* ── Alert Badge ─────────────── */
  .badge {
    position: absolute;
    top: -8px; right: -8px;
    width: 24px; height: 24px;
    background: var(--on-glow);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    opacity: 0;
    transform: scale(0);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 10px var(--on-glow-strong);
    pointer-events: none;
    z-index: 10;
  }
  .device-spot.on .badge {
    opacity: 1;
    transform: scale(1);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 10px var(--on-glow-strong); }
    50% { box-shadow: 0 0 22px var(--on-glow-strong), 0 0 44px var(--on-glow-soft); }
  }

  /* ── Device Label ────────────── */
  .dev-label {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    margin-top: 4px;
    white-space: nowrap;
    transition: color 0.3s;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .device-spot.on .dev-label { color: var(--text); }

  /* ═══ TV ═══════════════════════ */
  .tv-body {
    width: 200px; height: 120px;
    background: linear-gradient(180deg, #0f1218, #07090d);
    border-radius: 10px;
    border: 3px solid #2f3746;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    transition: border-color 0.4s, box-shadow 0.4s;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), 0 8px 18px rgba(0,0,0,0.26);
  }
  .tv-body::before {
    content:'';
    position: absolute;
    inset: 8px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }
  .tv-screen {
    width: 100%; height: 100%;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.03), transparent 30%),
      linear-gradient(180deg, #08090d, #0a0a0c 58%, #050609);
    transition: background 0.5s;
  }
  .tv-screen::before {
    content:'';
    position: absolute;
    top: 14px;
    left: 12px;
    width: 54px;
    height: 18px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    filter: blur(1px);
  }
  .tv-screen::after {
    content:'';
    position: absolute;
    inset: auto 0 0 0;
    height: 42%;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.2));
  }
  .device-spot.on .tv-body {
    border-color: #5d6d88;
    box-shadow: 0 0 30px rgba(100,160,255,0.25), 0 0 60px rgba(100,160,255,0.08), 0 8px 18px rgba(0,0,0,0.26);
  }
  .device-spot.on .tv-screen {
    background:
      linear-gradient(135deg, rgba(255,255,255,0.16), transparent 28%),
      linear-gradient(120deg, #12335c, #2255aa 46%, #31a2d6 74%, #173b79);
    animation: tvFlicker 4s ease-in-out infinite;
  }
  @keyframes tvFlicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.92; }
  }
  .tv-stand {
    width: 52px; height: 10px;
    background: linear-gradient(180deg, #323949, #212735);
    margin: 0 auto;
    border-radius: 0 0 8px 8px;
    position: relative;
  }
  .tv-stand::before {
    content:'';
    position: absolute;
    left: 50%;
    top: -16px;
    width: 10px;
    height: 18px;
    transform: translateX(-50%);
    border-radius: 0 0 6px 6px;
    background: linear-gradient(180deg, #394155, #232938);
  }

  /* ═══ Computer (monitor) ═══════ */
  .computer-body {
    width: 86px; height: 56px;
    background: linear-gradient(180deg, #11161e, #090c12);
    border-radius: 8px;
    border: 2px solid #2f3744;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    transition: border-color 0.4s, box-shadow 0.4s;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 6px 12px rgba(0,0,0,0.22);
  }
  .computer-body::before {
    content:'';
    position: absolute;
    inset: 5px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
  }
  .computer-screen {
    width: 100%; height: 100%;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.04), transparent 28%),
      linear-gradient(135deg, #0d1218, #07090d);
    transition: background 0.5s;
  }
  .computer-screen::before {
    content:'';
    position: absolute;
    top: 11px;
    left: 11px;
    width: 60px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 12px 0 rgba(255,255,255,0.04), 0 24px 0 rgba(255,255,255,0.03);
  }
  .device-spot.on .computer-body {
    border-color: #5a6d62;
    box-shadow: 0 0 20px rgba(100,255,160,0.2), 0 0 40px rgba(100,255,160,0.06), 0 6px 12px rgba(0,0,0,0.22);
  }
  .device-spot.on .computer-screen {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.12), transparent 25%),
      linear-gradient(135deg, #143126, #22aa55 54%, #163b30);
    animation: tvFlicker 4s ease-in-out infinite;
  }
  .computer-stand {
    width: 20px; height: 12px;
    background: linear-gradient(180deg, #364053, #232936);
    margin: 0 auto;
    clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
  }
  .computer-base {
    width: 44px; height: 5px;
    background: linear-gradient(180deg, #323a4d, #202634);
    margin: 0 auto;
    border-radius: 0 0 4px 4px;
  }

  /* ═══ Light (ceiling) ══════════ */
  .light-fixture {
    width: 56px; height: 18px;
    background: #3a3a4a;
    border-radius: 0 0 28px 28px;
    position: relative;
    transition: background 0.4s, box-shadow 0.4s;
    margin: 0 auto;
  }
  .light-wire {
    width: 2px; height: 14px;
    background: #3a3a4a;
    margin: 0 auto;
  }
  .device-spot.on .light-fixture {
    background: var(--light-glow);
    box-shadow: 0 8px 80px rgba(255,221,87,0.5), 0 4px 30px rgba(255,221,87,0.6), 0 0 120px rgba(255,221,87,0.2);
  }
  .light-cone {
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 90px solid transparent;
    border-right: 90px solid transparent;
    border-top: 180px solid rgba(255,221,87,0);
    transition: border-top-color 0.6s;
    pointer-events: none;
  }
  .device-spot.on .light-cone {
    border-top-color: rgba(255,221,87,0.10);
  }

  /* ═══ Indirect Light (desk lamp) ════ */
  .lamp-shade {
    width: 36px; height: 22px;
    background: #4a4a5a;
    border-radius: 50% 50% 0 0;
    position: relative;
    margin: 0 auto;
    transition: background 0.4s, box-shadow 0.4s;
    border: 1px solid #555;
    border-bottom: none;
  }
  .lamp-neck {
    width: 3px; height: 18px;
    background: #555;
    margin: 0 auto;
  }
  .lamp-base {
    width: 28px; height: 5px;
    background: #444;
    border-radius: 2px;
    margin: 0 auto;
  }
  .lamp-glow {
    position: absolute;
    bottom: -2px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 30px solid transparent;
    border-right: 30px solid transparent;
    border-top: 50px solid transparent;
    transition: border-top-color 0.5s;
    pointer-events: none;
  }
  .device-spot.on .lamp-shade {
    background: #ffcc44;
    box-shadow: 0 4px 40px rgba(255,200,60,0.45), 0 0 60px rgba(255,200,60,0.2);
  }
  .device-spot.on .lamp-glow {
    border-top-color: rgba(255,200,60,0.12);
  }

  /* ═══ Aircon ═══════════════════ */
  .aircon-body {
    width: 110px; height: 30px;
    background: linear-gradient(180deg, #e8e8e8, #d0d0d0);
    border-radius: 4px 4px 10px 10px;
    position: relative;
    transition: box-shadow 0.4s;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .aircon-vent {
    position: absolute;
    bottom: -4px; left: 10%; right: 10%;
    height: 5px;
    background: rgba(0,0,0,0.15);
    border-radius: 0 0 4px 4px;
  }
  .device-spot.on .aircon-body {
    box-shadow: 0 6px 30px rgba(100,200,255,0.3);
  }
  .aircon-wind {
    position: absolute;
    bottom: -36px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 3px;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .device-spot.on .aircon-wind {
    opacity: 1;
    animation: windDrift 2s ease-in-out infinite;
  }
  .wind-line {
    width: 2px; height: 18px;
    background: rgba(100,200,255,0.3);
    border-radius: 1px;
  }
  .wind-line:nth-child(2) { height: 25px; }
  .wind-line:nth-child(3) { height: 22px; }
  @keyframes windDrift {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(5px); }
  }
  .aircon-temp {
    position: absolute;
    bottom: -50px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .device-spot.on .aircon-temp.visible { opacity: 1; }

  /* ═══ Heater ═══════════════════ */
  .heater-body {
    width: 64px; height: 44px;
    background: linear-gradient(180deg, #4a4040, #3a2a2a);
    border-radius: 5px;
    position: relative;
    border: 2px solid #555;
    transition: border-color 0.4s, box-shadow 0.4s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .heater-grille {
    display: flex;
    gap: 3px;
  }
  .heater-bar {
    width: 3px; height: 24px;
    background: #555;
    border-radius: 1px;
    transition: background 0.4s, box-shadow 0.4s;
  }
  .device-spot.on .heater-body {
    border-color: #ff6644;
    box-shadow: 0 0 24px rgba(255,80,40,0.3);
  }
  .device-spot.on .heater-bar {
    background: #ff6644;
    box-shadow: 0 0 6px rgba(255,80,40,0.6);
    animation: heatGlow 1.5s ease-in-out infinite alternate;
  }
  .heater-bar:nth-child(2) { animation-delay: 0.2s; }
  .heater-bar:nth-child(3) { animation-delay: 0.4s; }
  .heater-bar:nth-child(4) { animation-delay: 0.6s; }
  @keyframes heatGlow {
    0% { background: #ff6644; }
    100% { background: #ff4422; box-shadow: 0 0 10px rgba(255,60,30,0.8); }
  }

  /* ═══ Robot Cleaner ════════════ */
  .cleaner-body {
    width: 46px; height: 46px;
    background: radial-gradient(circle, #444 60%, #333 100%);
    border-radius: 50%;
    position: relative;
    border: 2px solid #555;
    transition: border-color 0.4s, box-shadow 0.4s;
  }
  .cleaner-eye {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 14px; height: 7px;
    background: #222;
    border-radius: 7px;
    overflow: hidden;
  }
  .cleaner-eye-dot {
    width: 5px; height: 5px;
    background: #666;
    border-radius: 50%;
    margin: 1px auto;
    transition: background 0.3s;
  }
  .device-spot.on .cleaner-body {
    border-color: #4caf50;
    box-shadow: 0 0 16px rgba(76,175,80,0.3);
    animation: cleanerMove 3s ease-in-out infinite;
  }
  .device-spot.on .cleaner-eye-dot {
    background: #4caf50;
    box-shadow: 0 0 6px #4caf50;
  }
  @keyframes cleanerMove {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(8px, -4px) rotate(5deg); }
    50% { transform: translate(-4px, 2px) rotate(-3deg); }
    75% { transform: translate(4px, 4px) rotate(2deg); }
  }

  /* ═══ Air Purifier ═════════════ */
  .purifier-body {
    width: 40px; height: 56px;
    background: linear-gradient(180deg, #e0e0e0, #c8c8c8);
    border-radius: 8px;
    position: relative;
    border: 1px solid rgba(255,255,255,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: box-shadow 0.4s;
  }
  .purifier-vent {
    width: 24px; height: 2px;
    background: #999;
    border-radius: 1px;
  }
  .purifier-led {
    width: 7px; height: 7px;
    background: #666;
    border-radius: 50%;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .device-spot.on .purifier-body {
    box-shadow: 0 0 20px rgba(100,200,150,0.3);
  }
  .device-spot.on .purifier-led {
    background: #4caf50;
    box-shadow: 0 0 8px #4caf50;
  }
  .purifier-air {
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    font-size: 13px;
    transition: opacity 0.3s;
  }
  .device-spot.on .purifier-air {
    opacity: 1;
    animation: airFloat 2s ease-in-out infinite;
  }
  @keyframes airFloat {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.8; }
    50% { transform: translateX(-50%) translateY(-8px); opacity: 0.4; }
  }

  /* ═══ Speaker ══════════════════ */
  .speaker-body {
    width: 32px; height: 50px;
    background: linear-gradient(180deg, #3a3a3a, #2a2a2a);
    border-radius: 16px;
    position: relative;
    border: 1px solid #444;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: box-shadow 0.4s;
  }
  .speaker-dot {
    width: 5px; height: 5px;
    background: #555;
    border-radius: 50%;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .speaker-mesh {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, #333 0, #333 1px, #3a3a3a 1px, #3a3a3a 3px);
    border: 1px solid #444;
  }
  .device-spot.on .speaker-body {
    box-shadow: 0 0 20px rgba(168,85,247,0.3);
  }
  .device-spot.on .speaker-dot {
    background: #a855f7;
    box-shadow: 0 0 6px #a855f7;
  }
  .music-waves {
    position: absolute;
    top: -10px; right: -14px;
    opacity: 0;
    transition: opacity 0.3s;
    font-size: 16px;
  }
  .device-spot.on .music-waves {
    opacity: 1;
    animation: noteFloat 1.5s ease-in-out infinite;
  }
  @keyframes noteFloat {
    0%, 100% { transform: translateY(0) rotate(0); opacity: 1; }
    50% { transform: translateY(-8px) rotate(10deg); opacity: 0.7; }
  }

  /* ── Room Light Overlay ──────── */
  .room-light-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: background 0.8s, opacity 0.8s;
    z-index: 2;
    opacity: 0;
  }
  .room-light-overlay.lit {
    opacity: 1;
    background: rgba(255, 240, 180, 0.25);
  }

  /* ── Aircon Cold Overlay (blue) ── */
  .room-cold-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: opacity 1s;
    z-index: 2;
    opacity: 0;
    background:
      linear-gradient(180deg, rgba(140,210,255,0.18) 0%, rgba(140,210,255,0.06) 50%, transparent 100%);
  }
  .room-cold-overlay.active {
    opacity: 1;
  }

  /* ── Heater Warm Overlay (red) ── */
  .room-warm-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: opacity 1s;
    z-index: 2;
    opacity: 0;
    background:
      linear-gradient(180deg, rgba(255,120,80,0.16) 0%, rgba(255,100,60,0.06) 50%, transparent 100%);
  }
  .room-warm-overlay.active {
    opacity: 1;
  }

  /* ═══ RIO (BMO-style mascot) ═══ */
  .rio {
    position: absolute;
    top: 148px;
    left: 200px;
    width: 56px;
    z-index: 6;
    animation: rioBreathe 3s ease-in-out infinite;
    cursor: default;
  }
  @keyframes rioBreathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .rio-body {
    width: 56px;
    height: 68px;
    background: linear-gradient(180deg, #5ee8b0, #3cc98e);
    border-radius: 10px;
    border: 2px solid #2fa874;
    position: relative;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.25),
      inset 0 -4px 0 rgba(0,0,0,0.1),
      0 6px 20px rgba(0,0,0,0.3);
  }
  /* face screen */
  .rio-face {
    position: absolute;
    top: 6px;
    left: 7px;
    width: 42px;
    height: 32px;
    background: linear-gradient(180deg, #1a2a44, #162038);
    border-radius: 6px;
    border: 2px solid #2fa874;
    overflow: hidden;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
  }
  .rio-face::before {
    content: '';
    position: absolute;
    top: 3px; right: 4px;
    width: 10px; height: 5px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    transform: rotate(-12deg);
  }
  /* eyes */
  .rio-eye {
    position: absolute;
    top: 10px;
    width: 6px;
    height: 7px;
    background: #e8f5ff;
    border-radius: 50%;
    box-shadow: 0 0 4px rgba(200,240,255,0.5);
  }
  .rio-eye.left { left: 10px; }
  .rio-eye.right { right: 10px; }
  /* mouth */
  .rio-mouth {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 6px;
    border-bottom: 2px solid #e8f5ff;
    border-left: 2px solid #e8f5ff;
    border-right: 2px solid #e8f5ff;
    border-radius: 0 0 6px 6px;
    box-shadow: 0 1px 3px rgba(200,240,255,0.3);
  }
  /* blush */
  .rio-blush {
    position: absolute;
    top: 17px;
    width: 7px;
    height: 4px;
    background: rgba(255,120,140,0.45);
    border-radius: 50%;
    filter: blur(1px);
  }
  .rio-blush.left { left: 4px; }
  .rio-blush.right { right: 4px; }
  /* buttons area */
  .rio-buttons {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .rio-dpad {
    width: 16px;
    height: 16px;
    position: relative;
  }
  .rio-dpad::before {
    content: '';
    position: absolute;
    top: 5px; left: 0;
    width: 16px; height: 6px;
    background: #2a9a6e;
    border-radius: 2px;
  }
  .rio-dpad::after {
    content: '';
    position: absolute;
    top: 0; left: 5px;
    width: 6px; height: 16px;
    background: #2a9a6e;
    border-radius: 2px;
  }
  .rio-btn-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .rio-btn {
    width: 6px;
    height: 6px;
    border-radius: 50%;
  }
  .rio-btn.red { background: #e85050; box-shadow: inset 0 -1px 0 #b33; }
  .rio-btn.blue { background: #5088e8; box-shadow: inset 0 -1px 0 #336ab3; }
  /* arms */
  .rio-arm {
    position: absolute;
    top: 34px;
    width: 8px;
    height: 18px;
    background: linear-gradient(180deg, #5ee8b0, #3cc98e);
    border: 1.5px solid #2fa874;
    border-radius: 4px;
  }
  .rio-arm.left { left: -9px; transform: rotate(8deg); }
  .rio-arm.right { right: -9px; transform: rotate(-8deg); }
  /* legs */
  .rio-leg {
    position: absolute;
    bottom: -10px;
    width: 10px;
    height: 12px;
    background: linear-gradient(180deg, #5ee8b0, #3cc98e);
    border: 1.5px solid #2fa874;
    border-radius: 0 0 5px 5px;
  }
  .rio-leg.left { left: 12px; }
  .rio-leg.right { right: 12px; }
  /* name tag */
  .rio-name {
    text-align: center;
    margin-top: 12px;
    font-size: 9px;
    font-weight: 800;
    color: #5ee8b0;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(94,232,176,0.4);
  }

  /* ── Event Log ───────────────── */
  .log-section {
    max-width: 960px;
    width: 100%;
    margin: 0 auto 24px;
    padding: 0 20px;
  }
  .log-title { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .log-list {
    background: rgba(22,27,40,0.8);
    border-radius: 10px;
    padding: 12px 16px;
    max-height: 150px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 11px;
    line-height: 1.9;
    color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.04);
  }
  .log-entry .time { color: #5c6580; }
  .log-entry .cmd { color: var(--text); }
  .log-entry .ok { color: #4caf50; }
  .log-entry .fail { color: var(--on-glow); }
  .log-empty { font-style: italic; }

  footer {
    text-align: center;
    padding: 16px;
    color: var(--text-dim);
    font-size: 10px;
  }

  /* ── Responsive ──────────────── */
  @media (max-width: 1000px) {
    .room { width: 100%; height: 460px; }
    .tv-body { width: 150px; height: 90px; }
    .sofa { width: 200px; height: 60px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Thin<span>Q</span></div>
    <div class="sub">거실 스마트홈 대시보드</div>
  </div>
  <div class="conn">
    <div class="conn-dot" id="connDot"></div>
    <span id="connLabel">연결됨</span>
  </div>
</header>

<div class="room-wrap">
  <div class="room" id="room">
    <!-- Walls & Floor -->
    <div class="wall-back"></div>
    <div class="wall-panel left"></div>
    <div class="wall-panel right"></div>
    <div class="baseboard"></div>
    <div class="floor-area"></div>
    <div class="rug"></div>

    <!-- Window -->
    <div class="window"><div class="window-glow"></div></div>

    <!-- Furniture -->
    <div class="sofa"></div>
    <div class="coffee-table"></div>
    <div class="media-console"></div>

    <!-- RIO (BMO-style mascot) -->
    <div class="rio">
      <div class="rio-arm left"></div>
      <div class="rio-arm right"></div>
      <div class="rio-body">
        <div class="rio-face">
          <div class="rio-eye left"></div>
          <div class="rio-eye right"></div>
          <div class="rio-blush left"></div>
          <div class="rio-blush right"></div>
          <div class="rio-mouth"></div>
        </div>
        <div class="rio-buttons">
          <div class="rio-dpad"></div>
          <div class="rio-btn-group">
            <div class="rio-btn red"></div>
            <div class="rio-btn blue"></div>
          </div>
        </div>
        <div class="rio-leg left"></div>
        <div class="rio-leg right"></div>
      </div>
      <div class="rio-name">RIO</div>
    </div>
    <div class="plant">
      <div class="plant-leaf l1"></div>
      <div class="plant-leaf l2"></div>
      <div class="plant-leaf l3"></div>
      <div class="plant-pot"></div>
    </div>
    <div class="desk">
      <div class="desk-leg-l"></div>
      <div class="desk-leg-r"></div>
    </div>
    <div class="side-table">
      <div class="side-table-leg-l"></div>
      <div class="side-table-leg-r"></div>
    </div>

    <!-- Overlays -->
    <div class="room-light-overlay" id="lightOverlay"></div>
    <div class="room-cold-overlay" id="coldOverlay"></div>
    <div class="room-warm-overlay" id="warmOverlay"></div>

    <!-- ═══ Devices ═══ -->

    <!-- Ceiling Light: ceiling, slightly left of center -->
    <div class="device-spot" id="dev-light.main" style="top: 0; left: 38%; transform: translateX(-50%);">
      <div class="badge" style="top: 12px; right: -14px;">!</div>
      <div class="light-wire"></div>
      <div class="light-fixture">
        <div class="light-cone"></div>
      </div>
      <div class="dev-label">거실 조명</div>
    </div>

    <!-- TV: wall center-right -->
    <div class="device-spot" id="dev-tv.living_room" style="top: 70px; left: 50%; transform: translateX(-30%);">
      <div class="badge">!</div>
      <div class="tv-body"><div class="tv-screen"></div></div>
      <div class="tv-stand"></div>
      <div class="dev-label">TV</div>
    </div>

    <!-- Aircon: top-left corner -->
    <div class="device-spot" id="dev-aircon.living_room" style="top: 28px; left: 30px;">
      <div class="badge">!</div>
      <div class="aircon-body">
        <div class="aircon-vent"></div>
        <div class="aircon-wind">
          <div class="wind-line"></div>
          <div class="wind-line"></div>
          <div class="wind-line"></div>
          <div class="wind-line"></div>
          <div class="wind-line"></div>
        </div>
      </div>
      <div class="aircon-temp" id="aircon-temp"></div>
      <div class="dev-label">에어컨</div>
    </div>

    <!-- Indirect Light (lamp): on the side table, left -->
    <div class="device-spot" id="dev-light.indirect" style="top: 192px; left: 36px;">
      <div class="badge">!</div>
      <div class="lamp-shade">
        <div class="lamp-glow"></div>
      </div>
      <div class="lamp-neck"></div>
      <div class="lamp-base"></div>
      <div class="dev-label">간접등</div>
    </div>

    <!-- Heater: left wall, below aircon -->
    <div class="device-spot" id="dev-heater.living_room" style="top: 260px; left: 120px;">
      <div class="badge">!</div>
      <div class="heater-body">
        <div class="heater-grille">
          <div class="heater-bar"></div>
          <div class="heater-bar"></div>
          <div class="heater-bar"></div>
          <div class="heater-bar"></div>
          <div class="heater-bar"></div>
        </div>
      </div>
      <div class="dev-label">난방</div>
    </div>

    <!-- Computer (monitor): on the desk, right side -->
    <div class="device-spot" id="dev-computer.desk" style="top: 162px; right: 68px;">
      <div class="badge">!</div>
      <div class="computer-body"><div class="computer-screen"></div></div>
      <div class="computer-stand"></div>
      <div class="computer-base"></div>
      <div class="dev-label">컴퓨터</div>
    </div>

    <!-- Speaker (music): on the desk next to computer -->
    <div class="device-spot" id="dev-speaker.main" style="top: 170px; right: 158px;">
      <div class="badge">!</div>
      <div class="speaker-body">
        <div class="speaker-dot"></div>
        <div class="speaker-mesh"></div>
        <div class="speaker-dot"></div>
      </div>
      <div class="music-waves">&#9835;</div>
      <div class="dev-label">음악</div>
    </div>

    <!-- Air Purifier: right side, floor area near desk -->
    <div class="device-spot" id="dev-purifier.living_room" style="top: 290px; right: 42px;">
      <div class="badge">!</div>
      <div class="purifier-body">
        <div class="purifier-air">&#9729;</div>
        <div class="purifier-led"></div>
        <div class="purifier-vent"></div>
        <div class="purifier-vent"></div>
        <div class="purifier-vent"></div>
      </div>
      <div class="dev-label">공기청정기</div>
    </div>

    <!-- Robot Cleaner: far left floor corner -->
    <div class="device-spot" id="dev-cleaner.bot" style="bottom: 30px; left: 30px;">
      <div class="badge">!</div>
      <div class="cleaner-body">
        <div class="cleaner-eye"><div class="cleaner-eye-dot"></div></div>
      </div>
      <div class="dev-label">로봇청소기</div>
    </div>

  </div>
</div>

<div class="log-section">
  <div class="log-title">이벤트 로그</div>
  <div class="log-list" id="logList">
    <div class="log-empty">디바이스를 클릭하여 제어하세요…</div>
  </div>
</div>

<footer>ThinQ Bridge &middot; BMO / RIO &middot; 클릭으로 디바이스 ON/OFF</footer>

<script>
(function() {
  var ACTION_KO = {
    on:'ON', off:'OFF', start:'시작', stop:'정지',
    play:'재생', set_temperature:'온도 설정', reset:'RESET'
  };

  /* ── Click to toggle ──────────── */
  document.querySelectorAll('.device-spot').forEach(function(el) {
    el.addEventListener('click', function() {
      var id = el.id.replace('dev-', '');
      fetch('/api/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: id })
      }).catch(function(err) { console.error('toggle error', err); });
    });
  });

  /* ── Update UI ────────────────── */
  function updateUI(state) {
    if (!state || !state.devices) return;
    for (var id in state.devices) {
      var dev = state.devices[id];
      var el = document.getElementById('dev-' + id);
      if (!el) continue;
      if (dev.on) { el.classList.add('on'); } else { el.classList.remove('on'); }
      /* Aircon temperature badge */
      if (id === 'aircon.living_room') {
        var tag = document.getElementById('aircon-temp');
        if (dev.temperature_c != null && dev.on) {
          tag.textContent = dev.temperature_c + '\u00B0C';
          tag.classList.add('visible');
        } else { tag.classList.remove('visible'); }
      }
    }
    /* Light overlay */
    var lightDev = state.devices['light.main'];
    var ov = document.getElementById('lightOverlay');
    if (lightDev && lightDev.on) { ov.classList.add('lit'); } else { ov.classList.remove('lit'); }
    /* Aircon cold overlay (blue) */
    var airconDev = state.devices['aircon.living_room'];
    var cold = document.getElementById('coldOverlay');
    if (airconDev && airconDev.on) { cold.classList.add('active'); } else { cold.classList.remove('active'); }
    /* Heater warm overlay (red) */
    var heaterDev = state.devices['heater.living_room'];
    var warm = document.getElementById('warmOverlay');
    if (heaterDev && heaterDev.on) { warm.classList.add('active'); } else { warm.classList.remove('active'); }
  }

  function addLog(content, ok) {
    var list = document.getElementById('logList');
    var empty = list.querySelector('.log-empty');
    if (empty) empty.remove();
    var div = document.createElement('div');
    div.className = 'log-entry';
    var t = new Date().toLocaleTimeString('ko-KR');
    div.innerHTML = '<span class="time">' + t + '</span>  <span class="cmd">' + esc(content) + '</span>  <span class="' + (ok?'ok':'fail') + '">' + (ok?'\u2713':'\u2717') + '</span>';
    list.prepend(div);
    while (list.children.length > 40) list.removeChild(list.lastChild);
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* ── SSE ──────────────────────── */
  var dot = document.getElementById('connDot');
  var lbl = document.getElementById('connLabel');
  var prev = null;

  function connect() {
    var es = new EventSource('/api/events');
    es.onopen = function() { dot.classList.remove('off'); lbl.textContent = '연결됨'; };
    es.onmessage = function(e) {
      try {
        var st = JSON.parse(e.data);
        if (prev && prev.devices) {
          for (var id in st.devices) {
            var dev = st.devices[id];
            var p = prev.devices[id];
            if (p && dev.updated_at !== p.updated_at && dev.last_action) {
              var name = dev.name || id;
              var act = ACTION_KO[dev.last_action] || dev.last_action;
              addLog(name + ': ' + act, true);
            }
          }
        }
        prev = st;
        updateUI(st);
      } catch(err) { console.error(err); }
    };
    es.onerror = function() {
      dot.classList.add('off');
      lbl.textContent = '재연결 중…';
      es.close();
      setTimeout(connect, 3000);
    };
  }

  fetch('/api/state').then(function(r){return r.json();}).then(function(st){ prev=st; updateUI(st); }).catch(function(){}).finally(connect);
})();
</script>
</body>
</html>
