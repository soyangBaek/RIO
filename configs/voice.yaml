# ─────────────────────────────────────────────────────────────
# RIO 음성 인식 런타임 설정
#
# 본체 (src/app/main.py) 에서 LiveVoiceBackend 가 읽어 사용.
# 샌드박스는 configs/voice_sandbox.yaml 에서 이 파일을 extends 하여 사용한다.
# 튜닝 시에는 샌드박스에서 먼저 실험한 뒤 확정값을 이 파일에 반영한다.
# ─────────────────────────────────────────────────────────────

# ── 백엔드 실행 정책 ─────────────────────────────────────────
backend:
  # Phase 1: Rust worker 를 우선 사용하고, 준비되지 않았으면 Python backend 로 fallback.
  type: "rust"
  worker_path: "native/bin/rio-audio-worker"
  fallback_to_python: true
  startup_timeout_ms: 3000


# ── 오디오 캡처 (sounddevice + PipeWire) ────────────────────
audio:
  # PipeWire/PulseAudio 경유로 열기 위해 "pulse" 고정.
  # raw ALSA (hw:X,Y) 는 장치/환경마다 입력 포맷 차이가 커서 추천하지 않음.
  device: "pulse"

  sample_rate: 16000
  channels: 1
  blocksize: 512         # 약 32ms. Pi 에서 지연/안정성 균형이 좋은 기본값.
  dtype: "float32"

  # 프로그램 시작 시 pactl 로 mic 게인 자동 설정. null 이면 건드리지 않음.
  # close-talk (입 바로 앞): 20~30 권장.
  mic_gain_percent: 25

  # PipeWire/PulseAudio source 이름 부분 일치.
  # `device: "pulse"` 일 때는 실행 직전에 이 source 를 default input 으로 맞추고,
  # mic gain 도 같은 source 에 적용한다.
  # null 이면 현재 default source 를 그대로 사용한다.
  gain_target_source: "AB13X"


# ── 오디오 전처리 (시끄러운 환경용) ─────────────────────────
# VAD 가 끝난 utterance 세그먼트에 대해 ASR(whisper) 투입 직전 적용.
# per-chunk 가 아닌 per-utterance 라 스테이트 문제/클릭 아티팩트 없음.
# close-talk 조용한 방에선 꺼도 무방. 팬/에어컨/배경 음성 있는 환경에서 켠다.
preprocess:
  enabled: false
  # 1차 IIR 하이패스. cutoff_ratio ≈ cutoff_freq / sample_rate.
  # 0.01 @ 16kHz → ~160Hz 이하 제거 (팬/험/바람 소음).
  apply_highpass: true
  highpass_cutoff: 0.01
  # 노이즈 게이트. |x| <= threshold 는 0 으로. float32 normalized peak 기준.
  # 너무 높이면 작은 발화 첫/끝 음절이 깎임. 0.01 ~ 0.02 권장.
  apply_gate: true
  gate_threshold: 0.01
  # RMS 정규화. 입력 레벨 편차를 whisper 가 선호하는 수준으로 맞춘다.
  # 게인은 최대 10배로 제한, -1..1 클리핑.
  apply_normalize: true
  target_rms: 0.1


# ── VAD: RMS 기반 세그먼터 ──────────────────────────────────
vad:
  # 16-bit PCM 기준 RMS 임계값. AB13X close-talk 실측:
  # 조용한 방 일반 소음 max≈100~290, 간헐 스파이크 400~700 관측됨.
  # 350 에서는 소음 스파이크가 speech 로 오트리거되어 Listening↔Idle 플래핑 발생.
  # 700 으로 올려 스파이크를 거의 차단하면서 발화 RMS(수천) 여유 유지.
  threshold: 700
  # 300ms 는 숨쉬는 간격에 조각나기 쉬워 500ms 로 여유.
  min_silence_duration_ms: 500
  speech_pad_ms: 30
  # 150ms 이하 짧은 스파이크는 발화 아님으로 확실히 drop.
  min_speech_ms: 300


# ── ASR: faster-whisper 1.2.x ────────────────────────────────
asr:
  model: "base"          # tiny/base/small
  language: "ko"
  beam_size: 1
  compute_type: "int8"
  device: "cpu"
  # 0.6 에서는 "자" 단일글자 + no_speech=0.58 같이 경계선상 디코딩이
  # 통과해 16 초 걸리는 루프 + BUSY drop 연쇄 유발. 0.8 로 올려 애매한
  # 구간은 whisper 가 직접 버리게 한다. 발화 RMS 가 수천 수준인 본 환경
  # 에선 정상 발화는 no_speech≈0 이라 부작용 없음.
  no_speech_threshold: 0.8
  # 이전 디코딩 텍스트를 다음 컨텍스트로 넣으면 base 모델이 짧은 한국어
  # 명령에서 "컴퓨터 컴퓨터 컴퓨터..." 식 반복 hallucination 에 빠져
  # 디코딩이 30 초 이상 걸리는 케이스가 관찰됐다. 단발 명령이라 이전
  # 문맥이 주는 이득도 없으므로 false 로 둔다.
  condition_on_previous_text: false

  # logprob 하한. 이보다 낮으면 capture 에 주입 안 함 (환각 차단).
  # 샌드박스의 wake_word.min_asr_logprob 와 동일 역할.
  min_logprob: -1.0

  # Whisper 디코더 바이어싱. 공식 발화(docs/user-utterance-scenarios.md)
  # 어휘를 직전 문맥으로 주입해 디코딩을 해당 방향으로 기울인다.
  #
  # ⚠️ 과거에 공식 발화 전체 문장을 연결한 긴 prompt ("에어컨 켜줘 에어컨
  # 꺼줘 ...") 를 쓰니, base 모델이 "X 켜줘 / X 꺼줘" 반복 패턴을 학습한
  # 컨텍스트 위에서 디코딩 루프에 빠져 ASR 이 응답하지 않는 현상 발생.
  # → 중복 없는 명사/동사 어휘만 짧게 나열한다.
  initial_prompt: "에어컨 난방 거실 등 간접등 티비 컴퓨터 청소기 공기청정기 음악 사진 날씨 타이머 켜줘 꺼줘 틀어줘 돌려줘 찍어줘 알려줘 정지 확인 멈춰줘"


# ── 동시성 ───────────────────────────────────────────────────
concurrency:
  # depth=1 규칙. ASR 디코딩 중 새 utterance 가 도착하면 drop.
  # true 권장 (Pi CPU 보호 + 응답 일관성).
  drop_while_busy: true


# ── 로깅 ─────────────────────────────────────────────────────
logging:
  # INFO: 발화/디코딩 요약만. DEBUG: VAD 프레임 RMS(500ms 윈도우) 주기 로그.
  # CLI `--log info` 를 주면 런타임에 DEBUG + python backend 로 덮어쓴다 (튜닝용).
  level: "INFO"
